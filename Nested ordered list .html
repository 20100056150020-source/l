<html>
	<head>
		<title>nested ordered list</title>	
	</head>
	<body>
		<h1>nested ordered list</h1>
		<ul>
			<li>Fruits</li>
				<ul>
					<li>Apple</li>
					<li>Banana</li>
					<li>Mango</li>
					<li>Pine apple</li>
					<li>Gauva</li>
				</ul>
			<li>Vegetables</li>
				<ul>
					<li>Potato</li>
					<li>Onion</li>
					<li>pumpkin</li>
					<li>Tomato</li>
					<li>spinach</li>
				</ul>
		</ul>
	</body>
</html>
